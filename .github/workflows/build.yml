# Automatically build the project and run any configured tests for every push
# and submitted pull request. This can help catch issues that only occur on
# certain platforms or Java versions, and provides a first line of defence
# against bad commits.

name: build
on: [pull_request, push]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      # VM 后端的冒烟：不启动客户端，在纯 JVM 里验证 Rhino + scratch-vm 链路。
      # 夹具在 src/test/resources/turbomc-vm/，进版本控制，CI 上才存在。
      # 分开成独立步骤：失败时能直接看出是哪一环坏了，不必翻整段日志。

      # 扩展的两份产物由 tools/build-extension.js 生成，源在 turbowarp/src/。
      # 这一步守「改了数据源忘了重新生成」与「直接手改产物」两种漂移。
      - name: 扩展产物新鲜度
        run: node tools/build-extension.js --check
      # 扩展的编辑器契约：getInfo() 必须可结构化克隆（Worker postMessage）。
      # 菜单 items 写成函数会让 TurboWarp 抛 DataCloneError，写成方法名字符串会抛 reading 'call'。
      - name: 扩展自检
        run: node turbowarp/verify-extension.js
      # 映射表同样由代码生成（Sb3Mapping + blocks.data.js），守「文档描述不存在的积木」。
      - name: 映射表新鲜度
        run: node tools/build-mapping-report.js --check
      - name: smoke · 顺序执行
        run: ./gradlew vmSmoke
      # 合并块（一块 + 下拉）走一遍真实的 sb3 → VM → 桥 → Java 链路；
      # 夹具只用 slotField，因为它不读世界状态，纯 JVM 里能拿到确定值
      - name: smoke · 合并积木
        run: ./gradlew vmSmoke -PvmProject=merged-project.json
      - name: smoke · 事件帽子
        run: ./gradlew vmSmoke -PvmMode=hat -PvmProject=hat-project.json
      - name: smoke · 阻塞动作
        run: ./gradlew vmSmoke -PvmMode=block -PvmProject=block-project.json

      # 「等待直到 按下鼠标 [中键]?」必须挂住：守住布尔归一化接线（恒真事故）
      - name: 等待条件冒烟
        run: ./gradlew vmSmoke -PvmMode=wait -PvmProject=wait-mouse-project.json

      # JSON 29 块从 sb3 → VM → 桥整条链走一遍。断言的是「桥调用必须是 0」：
      # JSON 现在只在 JS 侧求值，出现非零说明又有积木漏回了 Java 路径。
      # 块级语义由 JsonCoreParityTest 的 118 条对拍守；这一条守的是接线。
      - name: smoke · JSON 本地求值
        run: ./gradlew vmSmoke -PvmMode=json -PvmProject=json-project.json

      - name: smoke · sb3 导入
        run: ./gradlew vmImport
      - name: smoke · 聊天帽子去重
        run: ./gradlew vmChat
      # 按键帽子：startHats 的字段匹配只认 field，对不上时起 0 个线程而不是报错，
      # 所以「按了没反应」只能靠这条兜住
      - name: smoke · 按键帽子
        run: ./gradlew vmKeyHat
      # 界面帽子：同一类静默失效，但字段是 SCREEN（container/inventory/any）
      - name: smoke · 界面帽子
        run: ./gradlew vmScreenHat
      # 列表监视器：HUD 读列表 + 算术积木 NUM1/NUM2 → A/B 的接线
      - name: smoke · 列表监视器
        run: ./gradlew vmList
      # 深度保护：超长 next 链必须被截断，否则打穿线程栈导致整局崩
      - name: smoke · 深度保护
        run: ./gradlew vmDepth
      - name: smoke · 数值字符串化
        run: ./gradlew vmNumberFormat
      - name: smoke · 扩展释放
        run: ./gradlew exportSmoke
      # AI 对话：本地 HTTP 桩，不打外部接口。端到端那一段守的是
      # ScriptBridge.poll 的 ai: 分支——漏了它等待会被立刻放行，回复永远是空串。
      - name: smoke · AI 对话
        run: ./gradlew vmAi
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Artifacts
          path: build/libs/
