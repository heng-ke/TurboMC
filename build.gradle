plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	mavenCentral() // 加上这一行！
	maven { url = "https://maven.terraformersmc.com/releases/" } // Mod Menu
	maven { url = "https://maven.shedaniel.me/" }               // Cloth Config
	maven { url = "https://maven.nucleoid.xyz/" }               // Text Placeholder API (Mod Menu 前置)
}

loom {
	splitEnvironmentSourceSets()

	runs {
		// 开发环境默认没有 --username，Minecraft 会自造 "Player###" 随机名。
		// 显式指定，保证每次启动的本地玩家名固定。
		client {
			programArgs "--username", "uzsdh"
		}
	}

	mods {
		"turbomc" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

configurations {
	// 需要合并进 mod jar 的普通（非 mod）依赖。Loom 的 include 只适用于 mod 依赖，
	// 第三方 Java 库走这里，由下面的 jar 任务解包合并。
	embed
	implementation.extendsFrom(embed)
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Rhino：在客户端内嵌 JS 运行时，承载 scratch-vm（见 vm 包）。
	// 用独立配置打包进 mod jar，避免把 Minecraft / Fabric 一起卷进来。
	embed "org.mozilla:rhino:1.7.15"

	// Java-WebSocket：远程开发桥的服务端（见 script/remote 包）。
	// 选它而不是 MC 自带的 Netty：不跟 1.21.11 的 Netty 版本耦合，只依赖 slf4j（MC 已有）。
	// 备选 Netty 要赌 netty-codec-http 在编译 classpath 上，升级易碎；手写要自己处理掩码与分片。
	embed "org.java-websocket:Java-WebSocket:1.6.0"

	// JUnit：只用于单元测试，不进发布 jar（test 配置本就不参与 jar 打包）。
	// 覆盖纯逻辑层——类型转换、聊天去重、平滑转向——这些最容易悄悄回归。
	testImplementation platform("org.junit:junit-bom:5.11.4")
	testImplementation "org.junit.jupiter:junit-jupiter"
	testRuntimeOnly "org.junit.platform:junit-platform-launcher"

	// Mod Menu: 仅客户端，软依赖（编译期可见 + 开发环境本地运行时加载，不写进发布依赖）
	modCompileOnly "com.terraformersmc:modmenu:${project.modmenu_version}"
	modLocalRuntime "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Cloth Config: 仅客户端，软依赖（配置界面在缺失时降级为提示屏）
	modCompileOnly("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
	modLocalRuntime("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude group: "net.fabricmc.fabric-api"
	}
}

processResources {
	def version = project.version
	inputs.property "version", version

	// 把 TurboWarp 扩展源文件打进 jar：客户端启动时由 ExtensionExporter 释放到 config/turbomc/，
	// 这样分发出去的 jar 自带可导入的 js，玩家不用再从仓库找文件。
	from("turbowarp/turbomc-extension.js") {
		into "assets/turbomc/turbowarp"
	}

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
	// 源码含中文注释与提示文案，强制 UTF-8，避免在 GBK 平台上出现乱码字面量。
	it.options.encoding = "UTF-8"
}

// 单元测试：用 JUnit Platform 跑 src/test/java 下的用例。
// 这里只放纯逻辑（不依赖 Minecraft 客户端）的测试；涉及客户端的验证走冒烟任务。
tasks.named('test', Test) {
	useJUnitPlatform()
	testLogging {
		events 'passed', 'skipped', 'failed'
		showStandardStreams = false
	}
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}

	// 把 Rhino 解包合并进 mod jar；签名与清单文件必须排除，否则会破坏 jar 校验
	from({ configurations.embed.collect { it.isDirectory() ? it : zipTree(it) } }) {
		exclude "META-INF/MANIFEST.MF"
		exclude "META-INF/*.SF", "META-INF/*.DSA", "META-INF/*.RSA"
	}
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE

	// 冒烟 / 基准类只用于 `gradlew vm*`，不随模组发布。
	// 别只写 *SmokeTest*：同目录的 ChatHatTest（vmChat 的入口）与 JsonBench 不符合该模式，
	// 曾因此混进发布 jar（约 23 KB 带 main 的测试代码）。这三个任务用的都是 classes 目录，
	// 从 jar 里排除不影响它们运行。
	exclude "xyz/turbomc/client/script/vm/*SmokeTest*.class"
	exclude "xyz/turbomc/client/script/vm/*Test.class"
	exclude 'xyz/turbomc/client/script/vm/*Test$*.class'
	exclude "xyz/turbomc/client/script/vm/JsonBench*.class"
}

// VM 后端的冒烟测试：不启动客户端，直接验证 Rhino + scratch-vm 链路
//
// 夹具放在 src/test/resources/turbomc-vm/（进版本控制，CI 上才存在）。
// 读取顺序：-PvmProject 指定的路径 → classpath 里的同名夹具。
// 换夹具不必改代码：把文件丢进 src/test/resources/turbomc-vm/ 即可。
tasks.register('vmSmoke', JavaExec) {
	group = 'verification'
	description = '在纯 JVM 中跑通 VM 后端（-PvmProject=路径 -PvmMode=hat）'
	mainClass = 'xyz.turbomc.client.script.vm.VmSmokeTest'
	classpath = sourceSets.client.runtimeClasspath + sourceSets.test.output
	def projectPath = providers.gradleProperty('vmProject').getOrElse('project.json')
	def mode = providers.gradleProperty('vmMode').getOrElse('')
	// -PperfWindow=50 把性能汇总窗口缩到 50 ms，便于冒烟里验证打点本身
	def perfWindow = providers.gradleProperty('perfWindow').getOrElse('30000')
	args = mode.isEmpty() ? [projectPath] : [projectPath, mode]
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8', "-Dturbomc.perf.windowMs=${perfWindow}"
}

// AI 对话冒烟：本地 HTTP 桩，不打真实接口
// 覆盖服务层的正常/非2xx/坏JSON/超时/会话互斥，以及 VM 里「挂起 → poll → 继续」端到端
tasks.register('vmAi', JavaExec) {
	group = 'verification'
	description = '验证 AI 对话链路：本地桩 + VM 端到端（不访问外部网络）'
	mainClass = 'xyz.turbomc.client.script.vm.AiSmokeTest'
	classpath = sourceSets.client.runtimeClasspath + sourceSets.test.output
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}

// 往返冒烟：编辑器积木树 → project.json → VM 执行
// 导入：sb3 → 可查看的积木树 + VM 执行
tasks.register('vmImport', JavaExec) {
	group = 'verification'
	description = '验证 sb3 能解析成可查看的积木树并被 VM 执行（-Psb3=路径）'
	mainClass = 'xyz.turbomc.client.script.vm.ImportSmokeTest'
	classpath = sourceSets.client.runtimeClasspath + sourceSets.test.output
	def sb3Path = providers.gradleProperty('sb3').getOrElse('fixture.sb3')
	args = [sb3Path]
	// 积木树是中文，控制台默认 GBK 会乱码
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}

// 「当聊天包含」的触发次数冒烟：一条消息只应让帽子跑一次
tasks.register('vmChat', JavaExec) {
	group = 'verification'
	description = '验证聊天帽子每次事件只触发一次，且关键词能过滤'
	mainClass = 'xyz.turbomc.client.script.vm.ChatHatTest'
	classpath = sourceSets.client.runtimeClasspath + sourceSets.test.output
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8' 
}

// 数值字符串化冒烟：守住「标量以原生 JS 值进入 VM」这条修复
tasks.register('vmNumberFormat', JavaExec) {
	group = 'verification'
	description = '验证数值积木的字符串化是 ECMAScript 格式（20 而非 20.0）'
	mainClass = 'xyz.turbomc.client.script.vm.NumberFormatSmokeTest'
	classpath = sourceSets.client.runtimeClasspath + sourceSets.test.output
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}

// 列表监视器冒烟：HUD 读列表必须拿到数据，算术积木参数名必须是 A/B
tasks.register('vmList', JavaExec) {
	group = 'verification'
	description = '验证「显示列表」能被 HUD 读到，以及 NUM1/NUM2 正确映射为 A/B'
	mainClass = 'xyz.turbomc.client.script.vm.ListMonitorSmokeTest'
	classpath = sourceSets.client.runtimeClasspath + sourceSets.test.output
	// -PlistProject=路径 可以换成玩家自己的工程（需先解出 project.json）
	def listProject = providers.gradleProperty('listProject').getOrElse('')
	args = listProject.isEmpty() ? [] : [listProject]
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}

// AT 预热测量：首次 loadProject 的冷路径能否被「init + 空工程」吃掉
tasks.register('vmPreload', JavaExec) {
	group = 'verification'
	description = '测量预热前后首次载入工程的耗时（-Pmode=cold|preload）'
	mainClass = 'xyz.turbomc.client.script.vm.PreloadSmokeTest'
	classpath = sourceSets.client.runtimeClasspath + sourceSets.test.output
	def preloadMode = providers.gradleProperty('mode').getOrElse('cold')
	args = [preloadMode]
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}

// 按键帽子冒烟：startHats 的字段匹配对得上要起线程、对不上要起 0 个
tasks.register('vmKeyHat', JavaExec) {
	group = 'verification'
	description = '验证「当按下 [键]」帽子按 KEY_OPTION 正确派发'
	mainClass = 'xyz.turbomc.client.script.vm.KeyHatSmokeTest'
	classpath = sourceSets.client.runtimeClasspath + sourceSets.test.output
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}

tasks.register('vmScreenHat', JavaExec) {
	group = 'verification'
	description = '验证「当打开 [界面]」帽子按 SCREEN 正确派发'
	mainClass = 'xyz.turbomc.client.script.vm.ScreenHatSmokeTest'
	classpath = sourceSets.client.runtimeClasspath + sourceSets.test.output
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}

// 深度保护冒烟：超长 next 链必须被截断，而不是栈溢出
tasks.register('vmDepth', JavaExec) {
	group = 'verification'
	description = '验证 sb3 的超长积木链会被深度保护截断，而不是打穿线程栈'
	mainClass = 'xyz.turbomc.client.script.vm.DepthSmokeTest'
	classpath = sourceSets.client.runtimeClasspath + sourceSets.test.output
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}

// JSON 积木基准：同一套算法在 Rhino（解释执行）与 Java 两侧的耗时对比
tasks.register('jsonBench', JavaExec) {
	group = 'verification'
	description = 'JSON 积木放在 VM 侧还是 Java 侧：耗时对比，不改生产代码'
	mainClass = 'xyz.turbomc.client.script.vm.JsonBench'
	classpath = sourceSets.client.runtimeClasspath + sourceSets.test.output
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}

// TurboWarp 扩展释放冒烟：创建 → 内容一致不动 → 内容过期覆盖
tasks.register('exportSmoke', JavaExec) {
	group = 'verification'
	description = '验证 jar 内的 TurboWarp 扩展能正确释放到 config/turbomc/'
	mainClass = 'xyz.turbomc.client.script.vm.ExtensionExportSmokeTest'
	classpath = sourceSets.client.runtimeClasspath + sourceSets.test.output
	jvmArgs '-Dfile.encoding=UTF-8', '-Dstdout.encoding=UTF-8'
}

// configure the maven publication
publishing {	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}
